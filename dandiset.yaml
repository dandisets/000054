description: Data included in Plitt & Giocomo (2021) Nature Neuroscience (https://doi.org/10.1038/s41593-021-00816-6).
  Data includes temporally aligned virtual reality linear track data and asosociated
  two photon calcium imaging of hippocampal region CA1. Animals were trained to run
  in different virtual reality tracks that could be convincingly morphed into each
  other. One group of mice, "Rare morph" animals (labeled 'RX' in dataset), were largely
  only shown tracks at the extremes of this morph axis during training but data from
  the full morph axis during testing. A second group of mice, "Frequent morph" animals
  (labeled 'FX' in dataset), were shown all of the tracks in equal probability during
  all sessions. A third group of mice were shown in equal probability during all sessions,
  but were trained to behaviorally group the tracks into two bins ("FDX" mice in dataset).
  See https://github.com/GiocomoLab/PlittGiocomo_2021 for replication
